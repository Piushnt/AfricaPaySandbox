services:
  web:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      target: web
    environment:
      API_INTERNAL_ORIGIN: http://api:3001
      PORT: 3000
    depends_on: [api]
    restart: unless-stopped
  api:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      target: api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      PORT: 3001
      DEMO_MODE: ${DEMO_MODE:-true}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  worker:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on: [api, redis]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payment_sandbox}
      POSTGRES_USER: ${POSTGRES_USER:-psa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psa} -d ${POSTGRES_DB:-payment_sandbox}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  proxy:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ../../nginx/vps.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [web, api]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
